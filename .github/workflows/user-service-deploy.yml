name: user-service-deploy

# Training/practice workflow — does NOT push to a registry or deploy anywhere.
# Verifies the production Docker image builds successfully on push to main.
# To enable real cloud deploy: uncomment the `permissions:` block and the
# commented steps below.

on:
  push:
    branches: [main]
    paths:
      - 'services/user-service/**'
      - 'packages/auth/**'
      - '.github/workflows/user-service-deploy.yml'

# permissions:
#   contents: read
#   id-token: write   # required for WIF

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build (no push)
        # Dockerfile expects build context = repo root (it copies ../../packages/auth),
        # so we build from the root with -f pointing to the service's Dockerfile.
        run: docker build -f services/user-service/Dockerfile -t user-service:${{ github.sha }} .

