name: user-service-ci

on:
  pull_request:
    paths:
      - 'services/user-service/**'
      - 'packages/auth/**'
      - '.github/workflows/user-service-ci.yml'

defaults:
  run:
    working-directory: services/user-service

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv pip install --system -r pyproject.toml --extra dev

      - name: Ruff
        run: ruff check .

      - name: Pytest
        # Runs unit (SQLite) + integration (testcontainers Postgres).
        # GHA runners have Docker, so testcontainers works out of the box.
        run: pytest
