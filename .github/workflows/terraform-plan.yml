name: terraform-plan

# Training/practice workflow — does NOT touch GCP.
# Runs fmt + validate against the Terraform code on PRs.
# `terraform plan` is skipped because it needs real GCP credentials and a
# reachable state backend.
# To enable real cloud plan: uncomment the `permissions:` block and the
# commented steps below.

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-plan.yml'

# permissions:
#   contents: read
#   id-token: write       # required for WIF
#   pull-requests: write  # to post the plan as a PR comment

defaults:
  run:
    working-directory: infrastructure/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: terraform init (providers only, no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

