name: terraform-apply

# Training/practice workflow — does NOT touch GCP.
# Demonstrates the manual-trigger (workflow_dispatch) pattern.
# Runs fmt + validate; the real `terraform apply` step is intentionally absent
# because it would require GCP credentials and a reachable state backend.
# To enable real cloud apply: uncomment the `permissions:` block, the
# `environment:` line, and the commented steps below.

on:
  workflow_dispatch:   # manual trigger from the GitHub UI ("Run workflow")

# permissions:
#   contents: read
#   id-token: write   # required for WIF

defaults:
  run:
    working-directory: infrastructure/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    # environment: production   # add required reviewers in Settings > Environments
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: terraform init (providers only, no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # --- Cloud apply (disabled for local training) --------------------------
