name: task-service-deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/task-service/**'
      - 'packages/auth/**'
      - '.github/workflows/task-service-deploy.yml'

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/578910743970/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: artifact-pusher@still-function-494322-d7.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Build & push image
        # Dockerfile expects build context = repo root (it copies ../../packages/auth),
        # so we build from the root with -f pointing to the service's Dockerfile.
        run: |
          IMAGE=europe-west3-docker.pkg.dev/still-function-494322-d7/taskmanager/task-service:${{ github.sha }}
          docker build -f services/task-service/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy task-service \
            --image europe-west3-docker.pkg.dev/still-function-494322-d7/taskmanager/task-service:${{ github.sha }} \
            --region europe-west3 \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --update-env-vars=KEYCLOAK_AUDIENCE=taskmanager-api
