[tool.poetry]
package-mode = false

[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "cf-auth",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "testcontainers[postgres]>=4"]

[tool.uv.sources]
cf-auth = { path = "../../packages/auth", editable = true }

[tool.poetry.dependencies]
cf-auth = { path = "../../packages/auth", develop = true }
